<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

<div id="modalLogin" class="modal">
    <div class="modal-content">

        <span class="cerrar">&times;</span>

        
        <form class="login-form">
          <img class="login-logo" src="../assets/Logo Oficial 24-02.png" alt="Logo de XADIZ Shop"/>

            <img class="login-icon" src="assets/icon/login.png" alt="Login">

            <label class="form-label-login" for="username">Nombre:</label>
            <input type="text" id="username" placeholder="Ingresar Usuario">
          
            <label class="form-label-login" for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ingresar Contraseña">

            <div class="box-visible">
                <input type="checkbox" id="visible">
                <label class="form-label-login" for="visible">Mostrar contraseña</label>
            </div>

            <button type="submit">Iniciar sesión</button>

        </form>

    </div>
</div>

</body>

</html>
