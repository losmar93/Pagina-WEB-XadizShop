<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <form class="login-form">

        <img class="login-logo" src="../assets/Logo Oficial 24-02.png" alt="Logo de XADIZ Shop"/>

        <img class="login-icon" src="../assets/icon/login.png" alt="Login icon">

        <label class="form-label-login" for="username">Usuario:</label>
        <input type="text" id="username" placeholder="Ingresar Usuario" required>

        <label class="form-label-login" for="password">Contraseña:</label>

        <input type="password" id="password" placeholder="Ingresar Contraseña" required>
        <div class="box-visible">
            <input type="checkbox" id="visible">
            <label class="form-label-login" for="visible">Mostrar Contraseña</label>
        </div>
        <button type="submit" id="submit">Iniciar sesión</button>
    </form>
    <script src="../JavaScript/script.js"></script>


</body>

</html>
